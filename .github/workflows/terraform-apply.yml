name: Grant SUPER_ADMIN (JIT via Okta OOB Push)

on:
  # PR 作成・更新時の検証は pull_request で受ける。
  # 新規ワークフローは main に入る前だと pull_request_target では起動しないため。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # マージ後の特権リースは trusted な base branch 定義から実行する。
  pull_request_target:
    branches: [main]
    types: [closed]

# ロール付与先が1つのため、workflow 全体で直列実行する。
concurrency:
  group: jit-super-admin
  cancel-in-progress: false

jobs:
  grant_super_admin:
    name: JIT SUPER_ADMIN ${{ github.event.pull_request.merged == true && '(Merged PR)' || '(Validation)' }}
    runs-on: ubuntu-latest

    # same-repo の PR 検証と、merge 済み PR の privileged path のみを扱う。
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)

    permissions:
      contents: read
      pull-requests: read

    env:
      OKTA_DOMAIN: ${{ secrets.OKTA_DOMAIN }}
      BRIDGE_CLIENT_ID: ${{ secrets.OKTA_BRIDGE_CLIENT_ID }}
      TERRAFORM_CLIENT_ID: ${{ secrets.OKTA_TERRAFORM_CLIENT_ID }}
      JIT_MODE: grant-with-lease
      ROLE_LEASE_SECONDS: ${{ github.event.pull_request.merged == true && '1800' || '60' }}

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout workflow/script under test.
      #    PR validation must use pull_request so newly added workflows can run
      #    before they exist on main. The merged-PR path keeps using
      #    pull_request_target so the privileged flow is still defined by the
      #    trusted base branch.
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}

      - name: Validate required Okta settings
        run: |
          missing=0
          for name in OKTA_DOMAIN BRIDGE_CLIENT_ID TERRAFORM_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "ERROR: ${name} is empty." >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: Configure repository secrets OKTA_DOMAIN, OKTA_BRIDGE_CLIENT_ID, and OKTA_TERRAFORM_CLIENT_ID." >&2
            exit 1
          fi

      # ------------------------------------------------------------------
      # 2. Resolve the approving admin's Okta login from the merger/author's
      #    GitHub public email. If it is unavailable, stop the workflow.
      # ------------------------------------------------------------------
      - name: Resolve admin email for OOB push
        id: resolve_email
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_LOGIN: ${{ github.event.pull_request.merged_by.login || github.event.pull_request.user.login }}
        run: |
          # TARGET_EMAIL=$(gh api "users/${TARGET_LOGIN}" --jq '.email // empty' 2>/dev/null || true)
          TARGET_EMAIL="maronn-infomation@maronn-room.com"
          if [ -n "$TARGET_EMAIL" ]; then
            echo "Resolved Okta login from GitHub: ${TARGET_EMAIL}"
            echo "admin_email=${TARGET_EMAIL}" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Cannot determine admin email from GitHub public profile for ${TARGET_LOGIN}." >&2
            echo "ERROR: Publish the approver's email on GitHub or adjust the workflow to resolve Okta logins another way." >&2
            exit 1
          fi

      # ------------------------------------------------------------------
      # 3. Set up Python
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests

      # ------------------------------------------------------------------
      # 4. JIT privilege escalation
      # ------------------------------------------------------------------
      - name: Trigger OOB push, grant SUPER_ADMIN, and revoke after lease
        env:
          # ADMIN_EMAIL: ${{ steps.resolve_email.outputs.admin_email }}
          ADMIN_EMAIL: "maronn-infomation@maronn-room.com"
        run: python -u scripts/okta_jit_privilege.py

      # ------------------------------------------------------------------
      # 5. Post-run note
      # ------------------------------------------------------------------
      - name: Post-run note
        run: |
          echo "This workflow grants SUPER_ADMIN only for a limited lease window."
          echo "Terraform apply is expected to run from a local terminal during that window."
          echo "Configured lease seconds: ${ROLE_LEASE_SECONDS}."

  fork_pr_notice:
    name: JIT SUPER_ADMIN (Fork PR Notice)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Explain why privileged validation is skipped for forks
        run: |
          echo "Skipping Okta JIT validation for a fork PR."
          echo "Repository secrets are not exposed to pull_request runs from forks."
          echo "Merged PR handling remains on pull_request_target from the trusted base branch."
