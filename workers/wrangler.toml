name = "ciba-payment-demo"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 有料プラン設定
# CPU時間: 最大30秒
# リクエスト時間: 最大5分

[vars]
OKTA_DOMAIN = "dev-123456.okta.com"

# シークレットは `wrangler secret put` で設定
# OKTA_CLIENT_ID
# OKTA_CLIENT_SECRET

[[kv_namespaces]]
binding = "PAYMENT_STORE"
id = "your-kv-namespace-id"
